    fileBase: `สรุปเหตุ191-${s.month === EX_ALL ? 'ทุกเดือน' : s.month}-${s.type === EX_ALL ? 'ทุกประเภท' : s.type}`.replace(/\s+/g, '-')
  };
}

// ---------- canvas drawing ----------
function exFont(size, weight) { return `${weight || 400} ${size}px ${EX_FONT}`; }
function exText(ctx, str, x, y, o) {
  o = o || {};
  ctx.font = exFont(o.size || 24, o.weight);
  ctx.fillStyle = o.color || EX_C.fg;
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.base || 'alphabetic';
  ctx.fillText(str, x, y);
  return ctx.measureText(str).width;
}
function exWidth(ctx, str, size, weight) { ctx.font = exFont(size, weight); return ctx.measureText(str).width; }
function exRRect(ctx, x, y, w, h, r, fill, stroke) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
}
// Break only before whitespace or a Thai word, never inside numbers, units or brackets.
function exTokens(str) {
  const raw = (typeof Intl !== 'undefined' && Intl.Segmenter)
    ? [...new Intl.Segmenter('th', { granularity: 'word' }).segment(str)].map((x) => x.segment) : str.split(/(\s+)/);
  const out = [];
  raw.forEach((t) => {
    const prev = out[out.length - 1];
    if (prev != null && (!/^[\s\u0E00-\u0E7F]/.test(t) || /[(\[]$/.test(prev))) out[out.length - 1] = prev + t;
    else out.push(t);
  });
  return out;
}
// Wraps text into at most maxLines lines; returns the y after the last line.
function exWrap(ctx, str, x, y, maxW, lineH, o, maxLines) {
  o = o || {};
  ctx.font = exFont(o.size || 24, o.weight);
  const lines = [];
  let cur = '';
  exTokens(str).forEach((tok) => {
    const next = cur + tok;
    if (ctx.measureText(next).width <= maxW || !cur.trim()) cur = next;
    else { lines.push(cur.trim()); cur = tok.trimStart(); }
  });
  if (cur.trim()) lines.push(cur.trim());
  const shown = lines.slice(0, maxLines || lines.length);
  if (maxLines && lines.length > maxLines) {
    let last = shown[shown.length - 1];
    while (last.length > 1 && ctx.measureText(last + '…').width > maxW) last = last.slice(0, -1);
    shown[shown.length - 1] = last + '…';
  }
  shown.forEach((ln, i) => exText(ctx, ln, x, y + i * lineH, o));
  return y + shown.length * lineH;
}
function exStripes(ctx, x, y, w, h, color) {
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.strokeStyle = color; ctx.lineWidth = 3;
  for (let i = -h; i < w; i += 10) { ctx.beginPath(); ctx.moveTo(x + i, y + h); ctx.lineTo(x + i + h, y); ctx.stroke(); }
  ctx.restore();
}
function exPanel(ctx, rect, title, note) {
  const [x, y, w, h] = rect;
  exRRect(ctx, x, y, w, h, 4, EX_C.panel, EX_C.line);
  exText(ctx, title, x + 28, y + 44, { size: 26, weight: 600, color: EX_C.fg });
  if (note) exText(ctx, note, x + w - 28, y + 44, { size: 18, color: EX_C.muted, align: 'right' });
  return { x: x + 28, y: y + 66, w: w - 56, h: h - 86 };
}
function exVBars(ctx, r, items, o) {
  o = o || {};
  const labelRoom = o.sub ? 52 : 30;
  const top = r.y + 30, base = r.y + r.h - labelRoom;
  const max = Math.max(0.0001, ...items.filter((i) => !i.na).map((i) => i.value));
  const step = r.w / items.length, bw = Math.min(o.maxBar || 64, step * 0.62);
  ctx.strokeStyle = EX_C.faint; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(r.x, base + 0.5); ctx.lineTo(r.x + r.w, base + 0.5); ctx.stroke();
  items.forEach((it, i) => {
    const cx = r.x + step * (i + 0.5);
    if (it.na) {
      ctx.save(); ctx.translate(cx, base - 10); ctx.rotate(-Math.PI / 2);
      exText(ctx, 'ไม่มีข้อมูล', 0, 0, { size: 18, color: EX_C.faint, base: 'middle' });
      ctx.restore();
    } else if (it.value > 0) {
      const h = Math.max(2, (base - top) * it.value / max);
      if (it.stripe) { exRRect(ctx, cx - bw / 2, base - h, bw, h, 3, EX_C.soft, it.color); exStripes(ctx, cx - bw / 2, base - h, bw, h, it.color); }
      else exRRect(ctx, cx - bw / 2, base - h, bw, h, Math.min(3, bw / 2), it.color);
      if (it.valueLabel) exText(ctx, it.valueLabel, cx, base - h - 8, { size: o.vsize || 22, weight: 600, align: 'center' });
    }
    if (it.label) exText(ctx, it.label, cx, base + 26, { size: o.lsize || 20, color: EX_C.muted, align: 'center' });
    if (it.sub) exText(ctx, it.sub, cx, base + 48, { size: 16, color: EX_C.faint, align: 'center' });
  });
}
function exHBars(ctx, r, items) {
  if (!items.length) return;
  const rowH = Math.min(52, r.h / items.length);
  const lw = Math.min(r.w * 0.45, Math.max(...items.map((i) => exWidth(ctx, i.label, 22))) + 14);
  const vw = Math.max(...items.map((i) => exWidth(ctx, i.valueLabel, 22, 600))) + 12;
  const max = Math.max(...items.map((i) => i.value), 1);
  items.forEach((it, i) => {
    const cy = r.y + rowH * (i + 0.5);
    exText(ctx, it.label, r.x + lw - 14, cy, { size: 22, align: 'right', base: 'middle' });
    const w = Math.max(2, (r.w - lw - vw) * it.value / max);
    exRRect(ctx, r.x + lw, cy - rowH * 0.28, w, rowH * 0.56, 3, i === 0 ? EX_C.navy : EX_C.sky);
    exText(ctx, it.valueLabel, r.x + lw + w + 10, cy, { size: 22, weight: 600, base: 'middle' });
  });
}
function exOutcomes(ctx, r, outcomes, total) {
  const barY = r.y + 6, barH = 40;
  let x = r.x;
  outcomes.forEach((o) => {
    const w = r.w * o.n / total;
    ctx.fillStyle = EX_OUT_COLOR[o.o]; ctx.fillRect(x, barY, Math.max(1, w - 2), barH);
    x += w;
  });
  const colW = r.w / 2;
  outcomes.forEach((o, i) => {
    const cx = r.x + (i % 2) * colW, cy = barY + barH + 44 + Math.floor(i / 2) * 40;
    exRRect(ctx, cx, cy - 15, 18, 18, 2, EX_OUT_COLOR[o.o], o.o === EX_UN ? EX_C.faint : null);
    exText(ctx, `${o.o} ${exPct(o.n / total)} (${exInt(o.n)} เหตุ)`, cx + 28, cy, { size: 22 });
  });
}

function exRender(sum, layoutKey) {
  const L = EX_LAYOUTS[layoutKey] || EX_LAYOUTS.landscape;
  const cv = document.createElement('canvas');
  cv.width = L.W; cv.height = L.H;
  const ctx = cv.getContext('2d');
  const { k } = sum;
  ctx.fillStyle = EX_C.bg; ctx.fillRect(0, 0, L.W, L.H);
  ctx.fillStyle = EX_C.navy; ctx.fillRect(0, 0, L.W, L.header);
  exText(ctx, 'สรุปเหตุรับแจ้ง 191 ภ.จว.เชียงราย', L.pad, L.header * 0.46, { size: layoutKey === 'portrait' ? 46 : 52, weight: 700, color: '#FFFFFF' });
  exText(ctx, `${sum.selLabel}   ${sum.period}`, L.pad, L.header * 0.78, { size: 28, color: EX_C.skyText });
  exText(ctx, `จัดทำ ${exToday()}`, L.W - L.pad, L.header * 0.78, { size: 22, color: EX_C.skyText, align: 'right' });

  const kp = L.kpi;
  const kw = (L.W - 2 * L.pad - (kp.cols - 1) * kp.gap) / kp.cols;
  const cards = [
    ['เหตุที่รับแจ้ง', exInt(k.total), 'เหตุ', `เฉลี่ย ${exMin(k.per_day)} เหตุต่อวัน`],
    ['รับแจ้งถึงถึงที่เกิดเหตุ (มัธยฐาน)', exMin(k.arrival_median), 'นาที', `ถึงภายใน 10 นาที ${exPct(k.within10_share)}`],
    ['ไปถึงแล้วไม่พบผู้ก่อเหตุ', exPct(k.notfound_share), '', `ระงับเหตุได้ ${exPct(k.handled_share)} นำตัวหรือนำส่ง ${exPct(k.taken_share)}`],
    ['รับแจ้งช่วงกลางคืน', exPct(k.night_share), '', '18:00 ถึง 02:59']
  ];
  cards.forEach(([lab, val, unit, sub], i) => {
    const x = L.pad + (i % kp.cols) * (kw + kp.gap), y = kp.y + Math.floor(i / kp.cols) * (kp.h + kp.gap);
    exRRect(ctx, x, y, kw, kp.h, 4, EX_C.panel, EX_C.line);
    exText(ctx, lab, x + 26, y + 40, { size: 22, color: EX_C.muted });
    const vw = exText(ctx, val, x + 26, y + 108, { size: 62, weight: 700, color: EX_C.navy });
    if (unit) exText(ctx, unit, x + 36 + vw, y + 108, { size: 26, color: EX_C.muted });
    exWrap(ctx, sub, x + 26, y + 146, kw - 52, 26, { size: 20, color: EX_C.muted }, 1);
  });

  const P = L.panels;
  const hourItems = sum.hours.map((h) => ({ value: h.n, label: h.hour % 3 === 0 ? h.label : '', color: h.hour >= 18 || h.hour < 3 ? EX_C.navy : EX_C.faint, valueLabel: '' }));
  const maxH = Math.max(...sum.hours.map((h) => h.n));
  hourItems.forEach((it, i) => { if (sum.hours[i].n === maxH && maxH > 0) it.valueLabel = exInt(maxH); });
  const drawHours = (rect) => exVBars(ctx, exPanel(ctx, rect, 'จำนวนเหตุตามชั่วโมงที่รับแจ้ง', 'สีน้ำเงิน = 18:00 ถึง 02:59'), hourItems, { lsize: 18, vsize: 20 });
  if (sum.s.month === EX_ALL) {
    const items = sum.months.map((m) => {
      const full = new Date(Date.UTC(Number(m.month.slice(0, 4)), Number(m.month.slice(5, 7)), 0)).getUTCDate();
      return m.exported === false ? { na: true, label: exMonthShort(m.month) }
        : { value: m.per_day || 0, valueLabel: exMin(m.per_day || 0), label: exMonthShort(m.month), sub: m.days < full ? `${exInt(m.days)} วัน` : '', color: EX_C.navy, stripe: !!m.missing_types };
    });
    const striped = items.filter((i) => i.stripe).length;
    const allStriped = striped > 0 && striped === items.filter((i) => !i.na).length;
    if (allStriped) items.forEach((i) => { i.stripe = false; });
    exVBars(ctx, exPanel(ctx, P.a, 'เหตุเฉลี่ยต่อวัน รายเดือน', allStriped ? 'ทุกเดือนขาดข้อมูลบางประเภท ดูหมายเหตุ' : striped ? 'ลายทาง = เดือนที่ไม่มีข้อมูลบางประเภท' : ''), items, { sub: true });
    drawHours(P.b);
  } else {
    drawHours(P.a);
    exOutcomes(ctx, exPanel(ctx, P.b, 'ผลเมื่อไปถึงที่เกิดเหตุ'), sum.outcomes, k.total);
  }
  exHBars(ctx, exPanel(ctx, P.c, 'สภ. ที่รับแจ้งมากที่สุด'), sum.stations.map((r) => ({ label: r.station, value: r.total, valueLabel: exInt(r.total) })));
  const fr = exPanel(ctx, P.d, 'ข้อค้นพบ');
  let fy = fr.y + 10;
  const lines = layoutKey === 'portrait' ? 3 : 2;
  sum.findings.slice(0, 3).forEach((f, i) => {
    exText(ctx, `${i + 1}.`, fr.x, fy, { size: 22, weight: 700, color: EX_C.navy });
    fy = exWrap(ctx, f, fr.x + 30, fy, fr.w - 30, 30, { size: 22 }, lines) + 10;
  });
  const foot = `หมายเหตุ: ${sum.caveats.join(' ')}`;
  const y = exWrap(ctx, foot, L.pad, L.foot, L.W - 2 * L.pad, 24, { size: 18, color: EX_C.muted }, layoutKey === 'portrait' ? 3 : 2);
  exText(ctx, 'ที่มา: ระบบรับแจ้งเหตุ 191 ภ.จว.เชียงราย ไม่มีข้อมูลส่วนบุคคล', L.pad, Math.min(L.H - 14, y + 2), { size: 18, color: EX_C.muted, weight: 600 });
  return cv;
}

// ---------- prompt ----------
function exPrompt(sum, layoutKey) {
  const L = EX_LAYOUTS[layoutKey] || EX_LAYOUTS.landscape;
  const k = sum.k;
  const out = [];
  out.push('ช่วยออกแบบ infographic ภาษาไทย สำหรับนำเสนอผู้บริหาร ตำรวจภูธรจังหวัดเชียงราย (ภ.จว.เชียงราย)');
  out.push('');
  out.push(`หัวข้อ: สรุปเหตุรับแจ้ง 191 ${sum.selLabel}`);
  out.push(`ช่วงข้อมูล: ${sum.period}`);
  out.push('');
  out.push('กติกาสำคัญ');
  out.push('1. ใช้เฉพาะตัวเลขในรายการด้านล่าง ห้ามคำนวณใหม่ ปัดเศษใหม่ หรือเติมตัวเลขเอง');
  out.push('2. สะกดชื่อ สภ. และประเภทเหตุตามที่ให้ไว้ทุกตัวอักษร');
  out.push('3. ข้อความภาษาไทยในภาพให้สั้นและตัวใหญ่ เพื่อไม่ให้ตัวอักษรเพี้ยน');
  out.push('');
  out.push('ตัวเลขหลัก');
  out.push(`- เหตุที่รับแจ้ง: ${exInt(k.total)} เหตุ (เฉลี่ย ${exMin(k.per_day)} เหตุต่อวัน จาก ${exInt(k.days)} วันที่มีข้อมูล)`);
  out.push(`- เวลารับแจ้งถึงสั่งการ (มัธยฐาน): ${exMin(k.dispatch_median)} นาที`);
  out.push(`- เวลารับแจ้งถึงถึงที่เกิดเหตุ (มัธยฐาน): ${exMin(k.arrival_median)} นาที ถึงภายใน 10 นาที ${exPct(k.within10_share)}`);
  out.push(`- ผลเมื่อไปถึง: ${sum.outcomes.map((o) => `${o.o} ${exPct(o.n / k.total)} (${exInt(o.n)} เหตุ)`).join(', ')}`);
  out.push(`- รับแจ้งช่วงกลางคืน (18:00 ถึง 02:59): ${exPct(k.night_share)}`);
  if (sum.types.length) {
    out.push('');
    out.push('แยกตามประเภทเหตุ');
    sum.types.forEach((t) => out.push(`- ${t.type}: ${exInt(t.total)} เหตุ, ไม่พบผู้ก่อเหตุ ${exPct(t.notfound_share)}, นำตัวหรือนำส่ง ${exPct(t.taken_share)}`));
  }
  if (sum.months.length) {
    out.push('');
    out.push('รายเดือน');
    sum.months.forEach((m) => out.push(m.exported === false ? `- ${exMonthLabel(m.month)}: ไม่มีข้อมูล (ไม่ได้เลือกประเภทนี้ตอนส่งออก)`
      : `- ${exMonthLabel(m.month)}: ${exInt(m.total)} เหตุ, ${exMin(m.per_day)} เหตุต่อวัน, ถึงที่เกิดเหตุมัธยฐาน ${exMin(m.arrival_median)} นาที${m.missing_types ? ` (ไม่มีข้อมูลประเภท ${m.missing_types})` : ''}`));
  }
  out.push('');
  out.push('สภ. ที่รับแจ้งมากที่สุด');
  sum.stations.forEach((r, i) => out.push(`${i + 1}. ${r.station}: ${exInt(r.total)} เหตุ`));
  if (sum.topHours.length) {
    out.push('');
    out.push(`ชั่วโมงที่รับแจ้งมากที่สุด: ${sum.topHours.map((h) => `${h.label} ถึง ${exPad2(h.hour)}:59 (${exInt(h.n)} เหตุ)`).join(', ')}`);
  }
  out.push('');
  out.push('ข้อค้นพบสำหรับผู้บริหาร');
  [...sum.findings, ...(sum.extra ? [sum.extra] : [])].forEach((f, i) => out.push(`${i + 1}. ${f}`));
  out.push('');
  out.push('ข้อจำกัดของข้อมูล (ใส่เป็นหมายเหตุตัวเล็กท้ายภาพ)');
  [...sum.caveats, ...sum.caveatsLong].forEach((c) => out.push(`- ${c}`));
  out.push('- ไม่มีชื่อบุคคล เบอร์โทร หรือสถานที่เกิดเหตุ');
  out.push('');
  out.push('รูปแบบ');
  out.push(`- ขนาด ${L.W}x${L.H} พิกเซล (${L.label})`);
  out.push('- สีหลักน้ำเงินกรมท่า #061C90 สีรองฟ้า #1CA4E1 พื้นขาวหรือเทาอ่อน #F6F7F9 ตัวอักษรเกือบดำ #050505');
  out.push('- ฟอนต์ไทยแบบไม่มีหัว เช่น Sarabun หรือ Noto Sans Thai');
  out.push('- โครง: แถบหัวเรื่อง, ตัวเลขหลัก 4 กล่อง, กราฟแท่ง (รายเดือนหรือรายชั่วโมง), สภ. 5 อันดับ, ข้อค้นพบ 3 ถึง 4 ข้อ, หมายเหตุข้อจำกัด');
  out.push('- มุมโค้งเล็ก ไม่มีเงา ไม่ใช้ emoji ไม่ใส่ไอคอนตกแต่ง ไม่ใส่ตราหรือโลโก้หน่วยงาน');
  out.push('- ระบุที่มาท้ายภาพ: ระบบรับแจ้งเหตุ 191 ภ.จว.เชียงราย');
  return out.join('\n');
}

function exEl(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
</script>

      const s = document.createElement('script');

// Chart image: drawn at twice the size for a sharp picture; w and h in the helpers' pixel units (100 px per inch).
function slChart(w, h, draw) {
  const cv = document.createElement('canvas');
  cv.width = w * 2; cv.height = h * 2;
  const ctx = cv.getContext('2d');
  ctx.scale(2, 2);
  ctx.fillStyle = EX_C.panel; ctx.fillRect(0, 0, w, h);
  draw(ctx, { x: 0, y: 0, w, h });
  return cv.toDataURL('image/png');
}
const slImg = (slide, dataUrl, x, y, w, h) => slide.addImage({ data: dataUrl.replace(/^data:/, ''), x, y, w, h });

function slHead(slide, title, sum) {

function slMonthItems(sum) {
  const items = sum.months.map((m) => {
    const full = new Date(Date.UTC(Number(m.month.slice(0, 4)), Number(m.month.slice(5, 7)), 0)).getUTCDate();
    return m.exported === false ? { na: true, label: exMonthShort(m.month) }
      : { value: m.per_day || 0, valueLabel: exMin(m.per_day || 0), label: exMonthShort(m.month), sub: m.days < full ? `${exInt(m.days)} วัน` : '', color: EX_C.navy, stripe: !!m.missing_types };
  });
  const striped = items.filter((i) => i.stripe).length;
  const allStriped = striped > 0 && striped === items.filter((i) => !i.na).length;
  if (allStriped) items.forEach((i) => { i.stripe = false; });
  return { items, note: allStriped ? 'ทุกเดือนขาดข้อมูลบางประเภท ดูหมายเหตุท้ายชุด' : striped ? 'แท่งลายทาง = เดือนที่ไม่มีข้อมูลบางประเภท (ไม่ได้เลือกตอนส่งออก)' : '' };
}

// Single-hue heatmap scale: pale grey-blue (few) to the ADT navy (many), t in 0..1. Shared with cards.js.
const slRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const SL_HEAT = [slRgb(EX_C.soft), slRgb(EX_C.navy)];
function slHeat(t) {
  const u = 0.1 + 0.9 * Math.max(0, Math.min(1, t)); // the smallest count is still visibly tinted
  const rgb = SL_HEAT[0].map((a, i) => Math.round(a + (SL_HEAT[1][i] - a) * u));
  return { hex: rgb.map((v) => v.toString(16).padStart(2, '0')).join('').toUpperCase(), dark: u > 0.5 };
}
const slTh = (text, o) => ({ text, options: Object.assign({ bold: true, color: 'FFFFFF', fill: { color: slHex(EX_C.navy) }, align: 'center' }, o) });

const slTable = (slide, rows, o) => slide.addTable(rows, Object.assign({
  x: SL_X, w: SL_CW, fontFace: SL_FONT, lang: 'th-TH', fontSize: 18, color: slHex(EX_C.fg), valign: 'middle',
  border: { type: 'solid', pt: 0.75, color: slHex(EX_C.line) }, margin: [0.03, 0.08, 0.03, 0.08]

function slPlan(sum) {

  const plan = [];

      const months = sum.months.map((m) => m.month);

      box('เหตุที่รับแจ้ง', exInt(k.total), 'เหตุ', `เฉลี่ย ${exMin(k.per_day)} ต่อวัน`,
        chg(k.per_day_change, `${exSigned(k.per_day_change || 0, exMin)} ต่อวัน${vs}`, '')),
      box('รับแจ้งถึงสั่งการ (มัธยฐาน)', exMin(k.dispatch_median), 'นาที', 'ศูนย์ 191 ถึงการสั่งสายตรวจ'),
      box('รับแจ้งถึงถึงที่เกิดเหตุ (มัธยฐาน)', exMin(k.arrival_median), 'นาที', `ถึงภายใน 10 นาที ${exPct(k.within10_share)} ของเหตุ`),
      box('ไปถึงแล้วไม่พบผู้ก่อเหตุ', exPct(k.notfound_share), '', `ระงับเหตุได้ ${exPct(k.handled_share)}`,
        chg(nfPts, `${exSigned(nfPts || 0, exInt)} จุด${vs}`, nfPts > 0 ? 'up' : nfPts < 0 ? 'down' : '')));
  }

  // Chart builders return a d3 SVG selection only; the screen puts it in a card, the share images in an image frame,
  // so both show the same drawing. onPick (screen only) receives the tapped row.
  function perDaySvg(s, onPick) {
    const rows = K().filter((r) => r.month !== A && r.type === s.type);
    const W = 320, H = 210, mt = 18, mb = 38, mx = 2;
    const svg = svgBox(W, H);
    const x = d3.scaleBand(rows.map((r) => r.month), [mx, W - mx]).padding(0.28);
    const y = d3.scaleLinear([0, Math.max(0.1, d3.max(rows, (r) => r.per_day) || 0)], [H - mb, mt]).nice();
    const bw = x.bandwidth();
    svg.append('line').attr('x1', mx).attr('x2', W - mx).attr('y1', y(0)).attr('y2', y(0)).style('stroke', C.axis);
    // Solid bars; a month without some types gets "*" after its name (stripes on every bar were hard to read on a phone).
    const on = (r) => s.month === A || r.month === s.month;
    const g = svg.append('g').selectAll('g').data(rows).join('g');
    g.filter((r) => r.exported !== false).append('rect').attr('x', (r) => x(r.month)).attr('width', bw).attr('y', (r) => y(r.per_day || 0)).attr('height', (r) => y(0) - y(r.per_day || 0))
      .attr('rx', 3).style('fill', (r) => (on(r) ? C.navy : C.muted));
    g.filter((r) => r.exported === false).append('text').attr('class', 'tk').attr('transform', (r) => `translate(${x(r.month) + bw / 2},${y(0) - 6}) rotate(-90)`).attr('dy', '0.32em').text('ไม่มีข้อมูล');
    g.filter((r) => r.exported !== false).append('text').attr('class', 'en').attr('x', (r) => x(r.month) + bw / 2).attr('y', (r) => y(r.per_day || 0) - 5).attr('text-anchor', 'middle').text((r) => (r.per_day == null ? '' : exMin(r.per_day)));
    g.append('text').attr('class', 'tk').attr('x', (r) => x(r.month) + bw / 2).attr('y', H - mb + 15).attr('text-anchor', 'middle').text((r) => exMonthShort(r.month) + (r.missing_types ? '*' : ''));
    g.append('text').attr('class', 'tk').attr('x', (r) => x(r.month) + bw / 2).attr('y', H - mb + 30).attr('text-anchor', 'middle')
      .text((r) => { const full = new Date(Date.UTC(Number(r.month.slice(0, 4)), Number(r.month.slice(5, 7)), 0)).getUTCDate(); return r.exported !== false && r.days < full ? `${r.days} วัน` : ''; });
    if (onPick) g.append('rect').attr('class', 'hit').attr('x', (r) => x(r.month) - (x.step() - bw) / 2).attr('width', x.step()).attr('y', 0).attr('height', H).style('fill', 'transparent')
      .on('click', (e, r) => onPick(r));
    return svg;
  }
  const perDayNote = (s) => 'หารด้วยจำนวนวันที่ไฟล์ครอบคลุม (ระบุจำนวนวันใต้เดือนที่ไม่ครบ)' +
    (K().some((r) => r.month !== A && r.type === s.type && r.missing_types) ? ' * คือเดือนที่ไม่มีข้อมูลบางประเภท (ไม่ได้เลือกตอนส่งออก) ตัวเลขรวมจึงต่ำกว่าความจริง' : '');
  function perDayCard(s) {
    const cur = s.month !== A ? kRow(s.month, s.type) : null;
    const info = detail(cur && cur.exported !== false ? `${exMonthLabel(cur.month)}: ${exInt(cur.total)} เหตุ ใน ${exInt(cur.days)} วัน เฉลี่ย ${exMin(cur.per_day)} ต่อวัน แตะอีกครั้งเพื่อกลับไปทุกเดือน`
      : 'แตะแท่งเพื่อเลือกเดือนนั้น');
    const svg = perDaySvg(s, (r) => { if (r.exported !== false) dash.setParams({ month: r.month === s.month ? A : r.month }); });
    return card('เหตุเฉลี่ยต่อวัน รายเดือน', perDayNote(s), chartBox(svg), info);
  }

  function arrivalSvg(s, onPick) {
    const all = K().filter((r) => r.month !== A && r.type === s.type);
    const rows = all.filter((r) => r.exported !== false && r.arrival_median != null);
    const W = 320, H = 200, mt = 24, mb = 24, mx = 14;
    const svg = svgBox(W, H);
    const x = d3.scalePoint(all.map((r) => r.month), [mx + 14, W - mx - 6]);
    const ext = d3.extent(rows, (r) => r.arrival_median);
    const y = d3.scaleLinear([Math.max(0, Math.floor((ext[0] ?? 0) - 1)), Math.ceil((ext[1] ?? 1) + 1)], [H - mb, mt]);
    const ticks = y.ticks(4);
    svg.append('g').selectAll('line').data(ticks).join('line').attr('x1', mx).attr('x2', W - mx).attr('y1', (t) => y(t)).attr('y2', (t) => y(t)).style('stroke', C.grid);
    svg.append('g').selectAll('text').data(ticks).join('text').attr('class', 'tk').attr('x', 0).attr('y', (t) => y(t) - 3).text((t) => exInt(t));
    svg.append('g').selectAll('text').data(all.filter((r) => r.exported === false)).join('text').attr('class', 'tk')
      .attr('transform', (r) => `translate(${x(r.month)},${(mt + H - mb) / 2}) rotate(-90)`).attr('text-anchor', 'middle').attr('dy', '0.32em').text('ไม่มีข้อมูล');
    svg.append('path').datum(all).attr('d', d3.line((r) => x(r.month), (r) => y(r.arrival_median)).defined((r) => r.exported !== false && r.arrival_median != null))
      .style('fill', 'none').style('stroke', C.navy).attr('stroke-width', 2.5).attr('stroke-linecap', 'round').attr('stroke-linejoin', 'round');
    const g = svg.append('g').selectAll('g').data(rows).join('g');
    g.append('circle').attr('cx', (r) => x(r.month)).attr('cy', (r) => y(r.arrival_median)).attr('r', (r) => (r.month === s.month ? 6 : 4))
      .style('fill', (r) => (r.month === s.month ? C.sky : C.navy));
    g.append('text').attr('class', 'en').attr('x', (r) => x(r.month)).attr('y', (r) => y(r.arrival_median) - 10).attr('text-anchor', 'middle').text((r) => exMin(r.arrival_median));
    svg.append('g').selectAll('text').data(all).join('text').attr('class', 'tk').attr('x', (r) => x(r.month)).attr('y', H - 6).attr('text-anchor', 'middle').text((r) => exMonthShort(r.month));
    if (onPick) svg.append('g').selectAll('rect').data(rows).join('rect').attr('class', 'hit').attr('x', (r) => x(r.month) - x.step() / 2).attr('width', x.step()).attr('y', 0).attr('height', H).style('fill', 'transparent')
      .on('click', (e, r) => onPick(r));
    return svg;
  }
  function arrivalTrendCard(s) {
    const info = detail('แตะจุดเพื่อดูรายละเอียดของเดือน');
    const svg = arrivalSvg(s, (r) => info.set(`${exMonthLabel(r.month)}: มัธยฐาน ${exMin(r.arrival_median)} นาที ถึงภายใน 10 นาที ${exPct(r.within10_share)} จาก ${exInt(r.total)} เหตุ`));
    return card('เวลารับแจ้งถึงถึงที่เกิดเหตุ (มัธยฐาน) รายเดือน', 'หน่วยเป็นนาที ใช้ดูว่าเวลาตอบสนองเปลี่ยนไปตามเดือนหรือไม่', chartBox(svg), info);
  }

  function viewOverview(sum) {
    const out = [];
    const s = sum.s;
    if (sum.empty) out.push(emptyCard());
    else {
      const findIcons = [IC.find, IC.clock, IC.pin, IC.info];
      out.push(h('section', { cls: 'm-insight' },
        h('div', { cls: 'm-head' }, h('span', { cls: 'm-round', style: 'width:30px;height:30px;background:#DCE2F8' }, icon(IC.bulb, 16)), h('h2', { style: 'margin:0;font-size:16px;font-weight:600', text: 'ข้อสังเกตสำคัญ' })),
        h('ul', { style: 'margin-left:40px' }, sum.findings.slice(0, 3).map((f, i) => h('li', {}, icon(findIcons[i], 16, '#1CA4E1'), h('span', { text: f }))))));
      out.push(kpiGrid(sum));
    }
    out.push(perDayCard(s), arrivalTrendCard(s));
    const notes = sum.empty ? [] : sum.caveats.filter((c) => !c.startsWith('ผลการตรวจสอบจัดกลุ่ม'));
    if (notes.length) out.push(h('p', { cls: 'm-note', text: `หมายเหตุ: ${notes.join(' ')}` }));
    out.push(h('section', { cls: 'm-card' }, h('details', { cls: 'm-how' }, h('summary', { text: 'วิธีอ่านตัวเลข' }),
      h('p', { text: 'เวลารับแจ้งถึงถึงที่เกิดเหตุ นับจากเวลารับแจ้งถึงเวลาถึงที่เกิดเหตุ (ช่อง "รวมเวลา" ในไฟล์ต้นฉบับนับจากเวลาสั่งการ จึงสั้นกว่าเล็กน้อย) ค่ามัธยฐานคือค่ากลางเมื่อเรียงจากน้อยไปมาก' }),
      h('p', { text: 'ผลการตรวจสอบจัดกลุ่มจากข้อความ "ปิดเหตุ" ด้วยกฎคำสำคัญ: ไม่พบผู้ก่อเหตุ (ไม่ ว.15 ไม่พบ แยกย้ายหรือหลบหนีไปก่อน), ระงับเหตุที่เกิดเหตุ (ว่ากล่าวตักเตือน สงบสติอารมณ์ ไกล่เกลี่ย), นำตัวหรือนำส่ง (นำส่ง รพ. นำตัวไป สภ. ตรวจยึด ดำเนินคดี), ไม่ใช่เหตุตามแจ้ง และไม่ระบุผล ควรทวนก่อนใช้อ้างอิง' }),
      h('p', { text: '"ไม่มีข้อมูล" คือไม่ได้เลือกประเภทนั้นตอนส่งออกจากระบบ 191 ไม่ได้แปลว่าไม่มีเหตุ ช่วงกลางคืนคือ 18:00 ถึง 02:59' }),
      h('p', { text: 'รวมไฟล์รายเดือนทุกไฟล์ ตัดเหตุที่หมายเลขเหตุซ้ำออก ไม่แสดงชื่อเจ้าหน้าที่ ผู้แจ้ง เบอร์โทร สถานที่ พิกัด และรายละเอียดเหตุ' }))));
    const remind = importReminder();
    if (remind) out.unshift(remind);
    return out;
  }

  // Editors only: once a month has ended and is not in the data (or the latest month stops before its last day),
  // say so on the overview with a button to the import page. Viewers never see it.
  function importReminder() {
    if (!CAN_EDIT) return null;
    const cov = coverage();
    if (!cov.length) return null;
    const last = cov[cov.length - 1];
    const now = new Date();
    const ym = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    const lastEnded = ym(new Date(now.getFullYear(), now.getMonth() - 1, 1));
    const [y, m] = last.month.split('-').map(Number);
    const fullDays = new Date(Date.UTC(y, m, 0)).getUTCDate();
    let text = null;
    if (last.month < lastEnded) text = `ยังไม่ได้นำเข้าข้อมูล ${exMonthLabel(ym(new Date(y, m, 1)))}`;
    else if (Number(last.days) < fullDays && last.month <= lastEnded) text = `ข้อมูล ${exMonthLabel(last.month)} ยังไม่ครบเดือน (ถึง ${exDate(last.end)})`;
    if (!text) return null;
    return h('div', { cls: 'm-remind', role: 'status' }, h('span', { style: 'flex:1' }, h('b', { text }), 'นำเข้าไฟล์จากระบบ 191 เมื่อพร้อม'), h('a', { href: url('import'), text: 'นำเข้า' }));
  }

  // ---------- types and months: matrix, outcome bars per type, comparison table ----------
  function matrixCard(s) {
    const k = K();
    const months = coverage().map((c) => c.month);
    const types = k.filter((r) => r.month === A && r.type !== A && r.total > 0).map((r) => r.type);
    const max = d3.max(k.filter((r) => r.type !== A && r.month !== A), (r) => r.total) || 1;
    const info = detail('');
    let peak = null;
    k.filter((r) => r.type !== A && r.month !== A && r.exported !== false).forEach((r) => { if (!peak || r.total > peak.total) peak = r; });
    const cur = s.month !== A && s.type !== A ? kRow(s.month, s.type) : null;
    info.set(cur ? (cur.exported === false ? `${s.type} ${exMonthLabel(s.month)}: ไม่มีข้อมูล (ไม่ได้เลือกตอนส่งออก)` : `${s.type} ${exMonthLabel(s.month)}: ${exInt(cur.total)} เหตุ ไม่พบผู้ก่อเหตุ ${exPct(cur.notfound_share)}`)
      : peak ? `มากที่สุด: ${peak.type} ${exMonthLabel(peak.month)} ${exInt(peak.total)} เหตุ แตะช่องเพื่อเลือกเดือนและประเภทพร้อมกัน` : '');
    const cols = h('colgroup', {}, months.map(() => h('col', {})), h('col', { style: 'width:38px' }));
    const head = h('tr', {}, months.map((m) => h('th', { cls: m === s.month ? 'on' : null, scope: 'col', text: exMonthShort(m) })), h('th', { scope: 'col', style: 'text-align:right', text: 'รวม' }));
    const body = types.flatMap((t) => [
      h('tr', {}, h('th', { cls: 'tn' + (t === s.type ? ' on' : ''), colspan: months.length + 1, scope: 'rowgroup', text: t })),
      h('tr', {}, months.map((m) => {
        const r = kRow(m, t);
        const na = r && r.exported === false;
        const v = r ? r.total : 0;
        const pct = v ? 10 + Math.round((70 * v) / max) : 0;
        const cls = [na ? 'na' : !v ? 'z' : '', s.month === m && s.type === A ? 'col' : '', s.month === m && s.type === t ? 'sel' : ''].filter(Boolean).join(' ');
        const style = na || !v ? null : `background:rgba(6,28,144,${(pct / 100).toFixed(2)});color:${pct > 45 ? '#FFFFFF' : '#121317'}`;
        return h('td', {}, h('button', { type: 'button', cls: cls || null, style, 'aria-label': `${t} ${exMonthLabel(m)} ${na ? 'ไม่มีข้อมูล' : exInt(v) + ' เหตุ'}`,
          onclick: na ? null : () => dash.setParams(s.month === m && s.type === t ? { month: A, type: A } : { month: m, type: t }) }, na ? '' : exInt(v)));
      }), h('td', { cls: 'tot', text: exInt(kRow(A, t).total) }))
    ]);
    const foot = h('tr', {}, months.map((m) => h('th', { text: exInt(kRow(m, A).total) })), h('th', { style: 'text-align:right', text: exInt(kRow(A, A).total) }));
    const key = h('div', { cls: 'm-key' },
      h('span', {}, 'น้อย', h('span', { style: 'display:inline-flex;gap:2px' }, [10, 28, 46, 64, 80].map((p) => h('span', { style: `width:14px;height:12px;border-radius:3px;background:rgba(6,28,144,${p / 100})` }))), `มาก (${exInt(max)})`),
      h('span', {}, h('span', { style: 'width:18px;height:12px;border-radius:3px;display:inline-block;border:1px solid #DDE1EA;background:repeating-linear-gradient(135deg,#FFFFFF 0 3px,#DDE1EA 3px 6px)' }), 'ไม่มีข้อมูล: ไม่ได้เลือกตอนส่งออก'));
    return h('section', { cls: 'm-card', style: 'padding:14px 12px' }, h('h2', { style: 'padding:0 4px', text: 'จำนวนเหตุ ประเภทคูณเดือน' }),
      h('p', { cls: 'm-note2', style: 'padding:0 4px', text: 'สีเข้มคือจำนวนมาก ตัวเลขในช่องคือจำนวนเหตุ แถวล่างสุดคือรวมทุกประเภทของเดือน' }),
      h('table', { cls: 'm-mx' }, cols, h('thead', {}, head), h('tbody', {}, body), h('tfoot', {}, foot)), info, key);
  }

  function typeBarsCard(s) {

    const max = Math.max(1, ...rows.map((r) => r.n));

      rows.map((d) => h('button', { type: 'button', cls: 'm-hb' + (d.type === s.type ? ' on' : '') + (s.type !== A && d.type !== s.type ? ' dim' : '') + (na(d) ? ' na' : ''),

  function viewTypes(sum) {

  // ---------- time: hour bars and daily bars ----------
  // Many bars (a whole period of days) get 5 px each and scroll sideways instead of being squeezed into the phone width.
  function barsSvg(rows, keyFn, labelFn, colorFn, onPick, decorate) {
    const H = 210, mb = 24, mt = 10, mr = 2;
    const y = d3.scaleLinear([0, Math.max(1, d3.max(rows, (d) => d.n) || 0)], [H - mb, mt]).nice();
    const ticks = y.ticks(Math.min(4, y.domain()[1])).filter(Number.isInteger);
    const ml = String(exInt(d3.max(ticks) || 0)).length * 7 + 8;
    const wide = rows.length > 62;
    const W = wide ? ml + rows.length * 5 + mr : 320;
    const svg = svgBox(W, H);
    if (wide) svg.attr('width', W).attr('height', H).style('width', `${W}px`);
    const x = d3.scaleBand(rows.map(keyFn), [ml, W - mr]).padding(rows.length > 60 ? 0.1 : 0.22);
    const bw = x.bandwidth();
    if (decorate) decorate(svg, x, y, bw, H, mb, mt);
    svg.append('g').selectAll('line').data(ticks).join('line').attr('x1', ml).attr('x2', W - mr).attr('y1', (t) => y(t)).attr('y2', (t) => y(t))
      .style('stroke', (t) => (t === 0 ? C.axis : C.grid));
    svg.append('g').selectAll('text').data(ticks).join('text').attr('class', 'tk').attr('x', ml - 5).attr('y', (t) => y(t)).attr('dy', '0.32em').attr('text-anchor', 'end').text((t) => exInt(t));
    svg.append('g').selectAll('rect').data(rows.filter((d) => d.n > 0)).join('rect')
      .attr('x', (d) => x(keyFn(d))).attr('width', bw).attr('y', (d) => y(d.n)).attr('height', (d) => y(0) - y(d.n)).attr('rx', Math.min(2.5, bw / 2)).style('fill', colorFn);
    svg.append('g').selectAll('text').data(rows.filter((d) => labelFn(d) != null)).join('text').attr('class', 'tk')
      .attr('x', (d) => x(keyFn(d)) + bw / 2).attr('y', H - 6).attr('text-anchor', 'middle').text(labelFn);
    if (onPick) svg.append('g').selectAll('rect').data(rows).join('rect').attr('class', 'hit')
      .attr('x', (d) => x(keyFn(d)) - (x.step() - bw) / 2).attr('width', x.step()).attr('y', mt).attr('height', H - mb - mt).style('fill', 'transparent')
      .on('click', (e, d) => onPick(d));
    return svg.property('wide', wide);
  }
  const bars = (...args) => { const svg = barsSvg(...args); return svg.property('wide') ? h('div', { cls: 'm-chart m-hscroll' }, svg.node()) : chartBox(svg); };
  const hourRows = (s) => dash.data('by_hour').data.filter((r) => r.month === s.month && r.type === s.type);
  const hourSvg = (s, onPick) => barsSvg(hourRows(s), (d) => d.label, (d) => (d.hour % 3 === 0 ? exPad2(d.hour) : null), (d) => (d.hour >= 18 || d.hour < 3 ? C.navy : C.muted), onPick);
  const HOUR_NOTE = 'เรียงจากเที่ยงวันถึงเช้าวันถัดไป แท่งสีน้ำเงินคือช่วง 18:00 ถึง 02:59';

  function viewTime(sum) {
    const s = sum.s;
    if (isNA(s)) return [emptyCard()];
    const hours = hourRows(s);
    const peakH = hours.reduce((a, b) => (b.n > a.n ? b : a));
    const k = kRow(s.month, s.type);
    const hInfo = detail(`มากที่สุด ${peakH.label} ถึง ${exPad2(peakH.hour)}:59 (${exInt(peakH.n)} เหตุ) กลางคืนรวม ${exPct(k.night_share)} แตะแท่งเพื่อดูชั่วโมงอื่น`);
    const hourCard = card('จำนวนเหตุตามชั่วโมงที่รับแจ้ง', HOUR_NOTE,
      chartBox(hourSvg(s, (d) => hInfo.set(`${d.label} ถึง ${exPad2(d.hour)}:59: ${exInt(d.n)} เหตุ (${exPct(d.n / k.total)})`))), hInfo);
    const days = dash.data('by_day').data.filter((r) => r.type === s.type && (s.month === A || r.month === s.month));
    const naMonths = s.type === A || s.month !== A ? [] : [...new Set(days.map((r) => r.month))].filter((m) => { const r = kRow(m, s.type); return r && r.exported === false; });
    const first = new Set();
    days.forEach((r) => { if (!first.has(r.month)) { first.add(r.month); first.add(r.month + '|' + r.date); } });
    const peakD = days.filter((d) => !naMonths.includes(d.month)).reduce((a, b) => (b.n > a.n ? b : a), days[0]);
    const dInfo = detail(peakD ? `มากที่สุด ${peakD.weekday} ${peakD.day} ${exMonthShort(peakD.month)} (${exInt(peakD.n)} เหตุ) แตะแท่งเพื่อดูวันอื่น` : '');
    const dayCard = card('จำนวนเหตุรายวัน', `${s.month === A ? 'ทั้งช่วง เลื่อนซ้ายขวาเพื่อดูเดือนก่อนหน้า' : exMonthLabel(s.month)} แท่งสีฟ้าคือวันเสาร์และอาทิตย์`,

        (svg, x, y, bw, H, mb, mt) => {
          if (!naMonths.length) return;

          naMonths.forEach((m) => {
            const ds = days.filter((r) => r.month === m);

            if (x1 - x0 > 14) svg.append('text').attr('class', 'tk').attr('transform', `translate(${(x0 + x1) / 2},${(mt + H - mb) / 2}) rotate(-90)`).attr('text-anchor', 'middle').attr('dy', '0.32em').text('ไม่มีข้อมูล');

  }

  // ---------- area and outcome: stations by outcome, arrival minutes per incident ----------
  function viewArea(sum) {
    const s = sum.s;

    const rows = dash.data('by_station').data.filter((r) => r.month === s.month && r.type === s.type);

    const stationCard = card('เหตุตามพื้นที่รับผิดชอบ (สภ.) แยกตามผลการตรวจสอบ', `เรียงจากรับแจ้งมากไปน้อย ${exInt(rows.length)} สภ.`, outLegend(),
      rows.map((d) => h('button', { type: 'button', cls: 'm-st', 'aria-label': `${d.station} ${exInt(d.total)} เหตุ ${outText(d)}`,

        h('span', { cls: 'c', text: exInt(d.total) }))),
      sInfo);
    const k = kRow(s.month, s.type);
    const aInfo = detail('แตะคอลัมน์เพื่อดูจำนวนเหตุจริงของนาทีนั้น');
    const dots = dotsSvg(s, (b, CAP) => aInfo.set(`${b.bin === CAP ? `${CAP} นาทีขึ้นไป` : `${b.bin} ถึง ${b.bin + 1} นาที`}: ${exInt(b.n)} เหตุ${b.n ? ` (${outText(b)})` : ''}`));
    const arrivalCard = card('เวลารับแจ้งถึงไปถึง', dotsNote(dots.property('unit')), outLegend(), chartBox(dots), aInfo,
      k && k.time_issue ? h('p', { cls: 'm-note2', style: 'margin:10px 0 0', text: `ข้อสังเกตคุณภาพข้อมูล: มี ${exInt(k.time_issue)} เหตุที่เวลาสั่งการหรือเวลาเดินทางผิดปกติ (ติดลบ เป็นศูนย์ หรือสั่งการช้ากว่า 60 นาที) น่าจะเป็นการบันทึกผิดหรือบันทึกย้อนหลัง` }) : null);
    return [stationCard, arrivalCard];
  }

  // Dot histogram of minutes from report to arrival, one-minute bins, 20+ minutes in the last bin, dots coloured by
  // outcome (not found at the bottom) and a dashed median. When a bin holds more incidents than fit as dots, one dot
  // stands for 2, 5, 10 or 20 incidents; each bin's dots are split between outcomes by the largest remainder.
  const dotsNote = (unit) => `${unit === 1 ? '1 จุด = 1 เหตุ' : `1 จุด ประมาณ ${unit} เหตุ`}, ช่องละ 1 นาที เส้นประคือมัธยฐาน เกิน 20 นาทีรวมไว้ที่ขวาสุด สีตามผลเมื่อไปถึง`;
  function dotsSvg(s, onPick) {
    const CAP = 20, MAXDOTS = 18;
    const binsData = d3.range(0, CAP + 1).map((b) => {
      const o = { bin: b, n: 0 };
      OUT_KEYS.forEach(([, key]) => { o[key] = 0; });
      return o;
    });
    const keyOf = Object.fromEntries(OUT_KEYS);
    dash.data('incidents').data.filter((r) => inSel(r, s) && Number(r.arrival_min) >= 0).forEach((r) => {
      const b = binsData[Math.min(CAP, Math.floor(Number(r.arrival_min)))];
      b.n++; b[keyOf[r.outcome] || 'unknown']++;
    });
    const peak = d3.max(binsData, (b) => b.n) || 1;
    const unit = [1, 2, 5, 10, 20, 50].find((u) => peak / u <= MAXDOTS) || 100;
    binsData.forEach((b) => {
      const total = b.n ? Math.max(1, Math.round(b.n / unit)) : 0;

      parts.forEach((p) => { p.dots = Math.floor(p.exact); });

      parts.slice().sort((p, q) => (q.exact - q.dots) - (p.exact - p.dots)).forEach((p) => { if (left > 0 && p.exact > p.dots) { p.dots++; left--; } });

    svg.append('line').attr('x1', mx).attr('x2', W - mx).attr('y1', base + 2).attr('y2', base + 2).style('stroke', C.axis);
    svg.append('g').selectAll('text').data([0, 5, 10, 15, 20]).join('text').attr('class', 'tk').attr('x', (t) => x(t) + x.bandwidth() / 2).attr('y', H - 6)
      .attr('text-anchor', 'middle').text((t) => (t === CAP ? `${CAP}+` : exInt(t)));
    const r = Math.max(2, step / 2 - 1);
    binsData.forEach((b) => b.dots.forEach((o, i) => {
      svg.append('circle').attr('cx', x(b.bin) + x.bandwidth() / 2).attr('cy', base - (i + 0.5) * step).attr('r', r)
        .style('fill', outColor(o)).style('stroke', o === EX_UN ? '#9AA0AD' : 'none').style('stroke-width', 0.6);
    }));
    if (median != null) {
      const mxp = x(Math.min(CAP, Math.floor(median))) + x.bandwidth() * Math.min(1, median - Math.floor(median));
      svg.append('line').attr('x1', mxp).attr('x2', mxp).attr('y1', mt - 10).attr('y2', base + 2).style('stroke', '#050505').attr('stroke-width', 1.5).attr('stroke-dasharray', '4 3');
      const lbl = `มัธยฐาน ${exMin(median)} นาที`;
      const right = mxp + 6 + lbl.length * 5.8 < W;
      svg.append('text').attr('class', 'en').attr('x', right ? mxp + 5 : mxp - 5).attr('y', mt - 2).attr('text-anchor', right ? 'start' : 'end')
        .style('stroke', '#FFFFFF').style('stroke-width', 3).style('paint-order', 'stroke').text(lbl);
    }

      .attr('width', x.step()).attr('y', 0).attr('height', H).style('fill', 'transparent').on('click', (e, b) => onPick(b, CAP));
    return svg;
  }

  // ---------- incident list ----------
  function viewList(sum) {
    const s = sum.s;
    if (isNA(s)) return [emptyCard()];
    const base = dash.data('incidents').data.filter((r) => inSel(r, s));
    const count = h('span', { style: 'font-size:13px;color:var(--muted)' });

    const more = h('div', {});
    const SORTS = {
      new: (a, b) => b.received.localeCompare(a.received),

        h('div', { cls: 'r' }, `${exMin(Number(r.arrival_min))} นาที`, h('small', { text: `สั่งการ ${exMin(Number(r.dispatch_min))} นาที` })),

      oninput: (e) => { list.q = e.target.value; list.limit = 50; fill(); } });
    const sort = h('select', { cls: 'm-select', 'aria-label': 'เรียงรายการ', onchange: (e) => { list.sort = e.target.value; list.limit = 50; fill(); } },
      [['new', 'รับแจ้งล่าสุดก่อน'], ['old', 'รับแจ้งเก่าสุดก่อน'], ['slow', 'ถึงช้าสุดก่อน'], ['fast', 'ถึงเร็วสุดก่อน'], ['station', 'ตาม สภ.'], ['type', 'ตามประเภทเหตุ']]
        .map(([v, t]) => h('option', { value: v, text: t, selected: list.sort === v })));
    fill();
    return [search, h('div', { style: 'display:flex;justify-content:space-between;align-items:center;gap:8px' }, count, sort),
      h('section', { cls: 'm-card', style: 'padding:4px 16px' }, box), more,
      h('p', { cls: 'm-note', text: 'ไม่แสดงชื่อเจ้าหน้าที่ ผู้แจ้ง เบอร์โทร สถานที่ พิกัด และรายละเอียดเหตุ' })];
  }

  // ---------- share images: the phone's own charts in a 4:5 frame (1080 x 1350 PNG) ----------
  // Each image is one SVG (header, white card, chart, footer) drawn to a canvas. The charts are the same builders the
  // screen uses; the parts that are HTML on screen (headline figures, matrix, bars per type and station) have SVG twins
  // here with the same layout and colours. No foreignObject, so the canvas can be saved on iPhone too.
  const IMG_W = 360, IMG_H = 450, IMG_SCALE = 3;
  const FONT = '"IBM Plex Sans Thai", Sarabun, "Noto Sans Thai", Tahoma, sans-serif';
  const mctx = document.createElement('canvas').getContext('2d');
  const textW = (str, size, weight) => { mctx.font = `${weight || 400} ${size}px ${FONT}`; return mctx.measureText(str).width; };
  const seg = typeof Intl !== 'undefined' && Intl.Segmenter ? new Intl.Segmenter('th', { granularity: 'word' }) : null;
  function wrap(str, size, weight, maxW, maxLines) {
    const parts = seg ? [...seg.segment(str)].map((p) => p.segment) : str.split(/(\s+)/);
    const lines = [];
    let cur = '';
    parts.forEach((p) => {
      if (cur && textW(cur + p, size, weight) > maxW) { lines.push(cur.trimEnd()); cur = p.trimStart(); } else cur += p;
    });
    if (cur.trim()) lines.push(cur.trimEnd());
    if (maxLines && lines.length > maxLines) { lines.length = maxLines; lines[maxLines - 1] += '...'; }
    return lines;
  }
  // The page font, embedded so the PNG uses it too (an SVG drawn as an image cannot load outside files).
  // If it cannot be fetched, the phone's own Thai font is used instead.
  let fontCss = null;
  const b64 = (buf) => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
  function embeddedFont() {
    if (!fontCss) fontCss = (async () => {
      try {
        const css = await fetch('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap').then((r) => (r.ok ? r.text() : ''));
        const blocks = [...css.matchAll(/\/\*\s*([a-z-]+)\s*\*\/\s*(@font-face\s*\{[^}]*\})/g)].filter((m) => m[1] === 'thai' || m[1] === 'latin').map((m) => m[2]);
        const out = await Promise.all(blocks.map(async (b) => {
          const u = (b.match(/url\((https:[^)]+)\)/) || [])[1];
          if (!u) return '';
          const buf = await fetch(u).then((r) => r.arrayBuffer());
          return b.replace(u, `data:font/woff2;base64,${b64(buf)}`);
        }));
        return out.join('\n');
      } catch (e) { return ''; }
    })();
    return fontCss;
  }
  const svgText = (g, x, y, str, o) => g.append('text').attr('x', x).attr('y', y).attr('text-anchor', (o && o.anchor) || 'start')
    .style('font-size', `${(o && o.size) || 11}px`).style('font-weight', (o && o.weight) || 400).style('fill', (o && o.color) || '#121317').text(str);
  function svgLegend(g, x, y, w, items) {
    let cx = x, cy = y;
    items.forEach(([label, color]) => {
      const iw = 14 + textW(label, 10) + 12;
      if (cx + iw > x + w && cx > x) { cx = x; cy += 15; }
      g.append('rect').attr('x', cx).attr('y', cy - 8).attr('width', 9).attr('height', 9).attr('rx', 2.5).style('fill', color).style('stroke', color === EX_OUT_COLOR[EX_UN] ? '#9AA0AD' : 'none');
      svgText(g, cx + 13, cy, label, { size: 10, color: '#3C4150' });
      cx += iw;
    });
    return cy + 14;
  }
  const outItems = () => { const present = new Set(dash.data('incidents').data.map((r) => r.outcome)); return OUT_KEYS.filter(([o]) => present.has(o)).map(([o]) => [o, outColor(o)]); };

  function kpiImageSvg(sum) {
    const { k } = sum;
    const svg = svgBox(320, 330);
    const f = sum.findings.slice(0, 3).map((t) => wrap(t, 11, 400, 270, 3));
    const fh = 30 + d3.sum(f, (l) => l.length * 15 + 6);
    svg.append('rect').attr('width', 320).attr('height', fh).attr('rx', 12).style('fill', '#F3F5FD').style('stroke', '#D4DBF5');
    svgText(svg, 14, 21, 'ข้อสังเกตสำคัญ', { size: 13, weight: 600 });
    let y = 40;
    f.forEach((lines, i) => {
      svg.append('circle').attr('cx', 21).attr('cy', y - 4).attr('r', 8).style('fill', '#FFFFFF').style('stroke', '#D4DBF5');
      svgText(svg, 21, y - 0.5, String(i + 1), { size: 9, weight: 700, color: C.navy, anchor: 'middle' });
      lines.forEach((l, j) => svgText(svg, 36, y + j * 15, l, { size: 11, color: '#3C4150' }));
      y += lines.length * 15 + 6;
    });
    const nfPts = k.notfound_change == null ? null : Math.round(k.notfound_change * 100);
    const boxes = [

  // Horizontal bars split by outcome: rows of { name, total, notfound, handled, ... }; name above the bar or beside it.
  function outcomeBarsSvg(rows, nameW) {
    const W = 320, cntW = 30, rowH = nameW ? 20 : 36;
    const svg = svgBox(W, Math.max(rowH, rows.length * rowH));
    const max = Math.max(1, ...rows.map((r) => r.total));
    const barW = W - cntW - (nameW ? nameW + 8 : 0);
    rows.forEach((r, i) => {
      const y = i * rowH;
      const by = nameW ? y + 4 : y + 19;
      if (nameW) svgText(svg, 0, y + 14, wrap(r.name, 10, 400, nameW, 1)[0], { size: 10 });
      else svgText(svg, 0, y + 12, r.name, { size: 10.5, weight: r.on ? 700 : 400, color: r.on ? C.navy : '#121317' });
      let x = nameW ? nameW + 8 : 0;
      const scale = (barW * r.total) / max;
      OUT_KEYS.forEach(([o, key]) => {
        if (!r[key]) return;
        const w = Math.max(1.5, (scale * r[key]) / r.total - 1);
        svg.append('rect').attr('x', x).attr('y', by).attr('width', w).attr('height', 12).attr('rx', 2).style('fill', outColor(o)).style('stroke', o === EX_UN ? '#9AA0AD' : 'none').style('stroke-width', 0.5);

    });
    return svg;
  }

        draw: (ctx) => {
          const hgt = ctx.canvas.height / CD_S;
          ctx.fillStyle = '#F3F5F9'; ctx.fillRect(0, 0, CD_W, hgt);
          ctx.drawImage(canvases[i], 0, (hgt - (CD_W * IMG_H) / IMG_W) / 2, CD_W, (CD_W * IMG_H) / IMG_W);
        }
      }));
      closeSheet();
      cdPresent({ plan: deck, returnFocus: fab });
    });
    saveBtn.addEventListener('click', async () => {
      if (!saveBtn.blobs) { say('กำลังเตรียมไฟล์ ลองอีกครั้ง'); return; }
      let ok = true;
      for (const i of [...chosen].sort((a, b) => a - b)) { ok = mSave(names[i], saveBtn.blobs[i]) && ok; await new Promise((r) => setTimeout(r, 400)); }
      say(ok ? 'เริ่มบันทึกแล้ว ถ้าไม่พบไฟล์ ให้กดค้างที่รูปตัวอย่างแล้วเลือกบันทึกรูป' : 'บันทึกจากหน้านี้ไม่ได้ ให้กดค้างที่รูปตัวอย่างแล้วเลือกบันทึกรูป');
    });
  }
  function actBtn(path, bg, fg, title, sub) {
    return h('button', { type: 'button', cls: 'm-act' },
      h('span', { cls: 'ic', style: `background:${bg};color:${fg}` }, icon(path, 20)),
      h('span', { cls: 'tx' }, h('b', { text: title }), h('span', { text: sub })),
      icon(IC.chev, 18, '#9AA0AD'));
  }

  // ---------- page ----------
  function render() {
    const sts = ['kpi', 'coverage', 'by_hour', 'by_day', 'by_station', 'by_type', 'incidents'].map((id) => dash.data(id).status);
    fab.disabled = !exReady();
    nav.querySelectorAll('button').forEach((b) => (b.dataset.page === view ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current')));
    if (sts.every((x) => x === 'ok' || x === 'loading') && sts.includes('loading')) { filters.replaceChildren(); main.replaceChildren(h('p', { cls: 'm-empty', text: 'กำลังโหลดข้อมูล...' })); return; }
    if (sts.some((x) => x !== 'ok')) {
      filters.replaceChildren();
      main.replaceChildren(h('section', { cls: 'm-card' }, h('p', { cls: 'm-empty' }, 'โหลดข้อมูลไม่สำเร็จ ', h('a', { href: url('status'), text: 'ดูสถานะระบบ' }))));
      return;
    }
    if (view === 'calls') { renderCalls(); return; }
    drawFilters();
    const sum = exSummary();
    const views = { overview: viewOverview, types: viewTypes, time: viewTime, area: viewArea, list: viewList };
    main.replaceChildren(...views[view](sum));
    main.querySelectorAll('.m-hscroll').forEach((e) => { e.scrollLeft = e.scrollWidth; });
  }
  // The summary tab has its own month list; sharing (images of the incident figures) does not apply to it.
  function renderCalls() {
    fab.disabled = true;
    // The summary came with the page (window.__BOOT); ask the server only if it did not.
    const boot = window.__BOOT && window.__BOOT.summary;
    if (calls.state === 'idle' && boot) {
      calls.list = PoliceSummary.fromSheetRows(boot.rows, boot.calls); calls.ready = boot.ready; calls.state = 'ok';
      calls.month = calls.list.length ? calls.list[calls.list.length - 1].month : '';
    }
    if (calls.state === 'idle') {
      calls.state = 'loading';
      google.script.run
        .withSuccessHandler((r) => {
          calls.list = PoliceSummary.fromSheetRows(r.rows, r.calls); calls.ready = r.ready; calls.state = 'ok';
          calls.month = calls.list.length ? calls.list[calls.list.length - 1].month : '';
          if (view === 'calls') render();
        })
        .withFailureHandler(() => { calls.state = 'failed'; if (view === 'calls') render(); })
        .getSummary();
    }
    if (calls.state === 'loading') { filters.replaceChildren(); main.replaceChildren(h('p', { cls: 'm-empty', text: 'กำลังโหลดรายงานสรุป...' })); return; }
    if (calls.state === 'failed') {
      filters.replaceChildren();
      main.replaceChildren(h('section', { cls: 'm-card' }, h('p', { cls: 'm-empty' }, 'โหลดรายงานสรุปไม่สำเร็จ ', h('a', { href: url('status'), text: 'ดูสถานะระบบ' }))));
      return;
    }
    const banner = !calls.ready && CAN_EDIT ? 'ยังไม่ได้ตั้งค่าแท็บรายงานสรุปใน Sheet ให้ผู้ดูแลรัน setupSheet อีกครั้ง' : '';
    if (!calls.list.length) { filters.replaceChildren(); main.replaceChildren(...CallsView.empty({ appUrl: APP, canEdit: CAN_EDIT, banner })); return; }
    filters.replaceChildren(CallsView.filters(calls.list, calls.month, (m) => { calls.month = m; window.scrollTo(0, 0); render(); }));
    main.replaceChildren(...CallsView.render(calls.list.find((x) => x.month === calls.month), dash.data('incidents').data, { banner }));
  }
  nav.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-page]');
    if (!b || !VIEWS.includes(b.dataset.page)) return;
    view = b.dataset.page;
    dash.setLink(view);
    window.scrollTo(0, 0);
    render();
  });
  fab.addEventListener('click', openSheet);
  account.addEventListener('click', openAccount);
  let lastSel = '';
  dash.onData(() => {
    const key = `${dash.params().month || A}|${dash.params().type || A}`;
    if (key !== lastSel) { lastSel = key; list.limit = 50; }
    render();
  });
})();
</script>

</body>
</html>
